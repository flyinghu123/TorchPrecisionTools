[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pprobe"
version = "0.1.0"
description = "PyTorch 训练框架精度问题定位探针（forward/backward IO dump + 采样 + 堆栈 + 跨运行/跨平台对比）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "flyinghu" }]
keywords = ["pytorch", "precision", "debug", "numerical", "training", "hook"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 运行时零强依赖：torch 由被注入的目标环境提供
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pprobe = "pprobe.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
